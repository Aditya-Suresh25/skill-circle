<style>
        .aurora-bg {
            background: 
                radial-gradient(circle at 15% 50%, rgba(145, 70, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(145, 70, 255, 0.1), transparent 40%);
            background-color: theme('colors.background');
        }
        
        .glass-card {
            background: rgba(24, 24, 27, 0.65);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(145, 70, 255, 0.2);
            border-left: 1px solid rgba(145, 70, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(145, 70, 255, 0.1);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 1px theme('colors.primary');
        }

        .role-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .role-card[data-active="true"] {
            background: rgba(145, 70, 255, 0.15);
            border-color: theme('colors.primary');
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.3);
        }

        .role-card:hover {
            transform: translateY(-2px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="aurora-bg min-h-screen text-on-surface font-body-lg flex flex-col relative overflow-hidden">
<div class="fixed inset-0 z-0 pointer-events-none">
<div class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-primary/10 blur-[120px] rounded-full mix-blend-screen"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-primary/10 blur-[100px] rounded-full mix-blend-screen"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center items-center px-container-margin py-xl relative z-10 w-full max-w-lg mx-auto">
<!-- Brand Header -->
<div class="text-center mb-xl w-full">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-xs drop-shadow-[0_0_15px_rgba(145,70,255,0.5)]">Skill Circle</h1>
<p class="font-body-lg text-body-lg text-on-surface" style="opacity: 0;">Enter the premium knowledge network.</p>
</div>
<!-- Login Container -->
<div class="glass-card w-full rounded-[24px] p-lg shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
<form class="flex flex-col gap-lg" id="loginForm">
<!-- Role Selection -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps block pl-base text-on-surface">Select Your Role</label>
<div class="grid grid-cols-3 gap-sm">
<!-- Student Role -->
<button class="role-card glass-card rounded-xl p-sm flex flex-col items-center justify-center gap-xs cursor-pointer border border-transparent" data-active="true" data-role="student" onclick="selectRole('student')" type="button">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-body-sm text-body-sm text-on-surface">Student</span>
</button>
<!-- Mentor Role -->
<button class="role-card glass-card rounded-xl p-sm flex flex-col items-center justify-center gap-xs cursor-pointer border border-transparent" data-active="false" data-role="mentor" onclick="selectRole('mentor')" type="button">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-body-sm text-body-sm text-on-surface">Mentor</span>
</button>
<!-- Admin Role -->
<button class="role-card glass-card rounded-xl p-sm flex flex-col items-center justify-center gap-xs cursor-pointer border border-transparent" data-active="false" data-role="admin" onclick="selectRole('admin')" type="button">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
<span class="font-body-sm text-body-sm text-on-surface">Admin</span>
</button>
</div>
</div>
<!-- Credentials Form -->
<div class="space-y-md">
<div class="space-y-base">
<label class="font-label-caps text-label-caps pl-base text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="glass-input w-full rounded-lg py-sm pl-xl pr-sm text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" id="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<div class="space-y-base">
<label class="font-label-caps text-label-caps pl-base text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="glass-input w-full rounded-lg py-sm pl-xl pr-sm text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" id="password" placeholder="••••••••" required="" type="password">
</div>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full bg-primary hover:bg-primary/80 border border-primary text-white font-title-md text-title-md py-sm rounded-lg backdrop-blur-md transition-all shadow-[0_0_15px_rgba(145,70,255,0.4)] hover:shadow-[0_0_20px_rgba(145,70,255,0.6)]" type="submit">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-lg text-center">
<a class="font-body-sm text-body-sm text-primary hover:text-primary/80 transition-colors" href="#">Forgot your password?</a>
</div>
</div>
</main>
<script>
        function selectRole(role) {
            document.querySelectorAll('.role-card').forEach(card => {
                card.setAttribute('data-active', card.dataset.role === role);
            });
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            setTimeout(() => {
                btn.innerHTML = originalText;
                // Add success state logic here
            }, 1500);
        });
    </script>


</body></html>
